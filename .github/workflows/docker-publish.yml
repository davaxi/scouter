name: Docker publish

# Builds every Scouter image and pushes it to Docker Hub
# (<namespace>/scouter-{app,crawler,renderer,mcp,postgres,clickhouse}) when a
# version tag is pushed: `git tag 0.8.0 && git push origin 0.8.0`.
#
# Required repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub
# access token with Read & Write scope). Optional repository variable:
# DOCKERHUB_NAMESPACE (defaults to davaxi).

on:
  push:
    tags: ['*.*.*', 'v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            context: .
          - image: crawler
            context: crawler-go
          - image: renderer
            context: renderer
          - image: mcp
            context: mcp
          - image: postgres
            context: docker/postgres
          - image: clickhouse
            context: docker/clickhouse
    env:
      IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || 'davaxi' }}/scouter-${{ matrix.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag 1.2.3 (or v1.2.3) → :1.2.3, :1.2 and :latest. A manual run
      # (workflow_dispatch) on a branch only pushes :<branch> and :sha-<short>.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
          labels: |
            org.opencontainers.image.title=scouter-${{ matrix.image }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
